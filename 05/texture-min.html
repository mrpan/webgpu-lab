<!doctype html>
<meta charset="utf-8">
<title>05 · 最小纹理 | webgpu-lab</title>
<p id="status" role="status">正在启动 WebGPU…</p>
<p><button id="toggle" disabled>切换到 linear</button></p>
<canvas id="c" width="512" height="512" style="background:#111;max-width:100%;height:auto"></canvas>
<script type="module">
const status = document.getElementById("status");
const button = document.getElementById("toggle");
try {
if (!navigator.gpu) throw new Error("当前浏览器无法使用 WebGPU，请先运行第一篇的环境检测页。");
const adapter = await navigator.gpu.requestAdapter();
if (!adapter) throw new Error("未找到可用的 GPU 适配器，请检查浏览器与硬件支持。");
const device  = await adapter.requestDevice();

const context = document.getElementById('c').getContext('webgpu');
const format  = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });
device.addEventListener("uncapturederror", e => { status.textContent = "GPU 错误：" + e.error.message; });

// 一张 4×4 的小图：河（蓝）、路（白）、绿地、建成区，每个纹素 4 字节 RGBA
const C = { R: [111, 168, 220], W: [242, 237, 227], G: [141, 191, 106], B: [201, 162, 126] };
const rows = ['GGWB', 'RGWB', 'RRWG', 'BRRG'];
const pixels = new Uint8Array(rows.join('').split('').flatMap(k => [...C[k], 255]));

const texture = device.createTexture({
  size: [4, 4],
  format: 'rgba8unorm',
  usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
});
device.queue.writeTexture({ texture }, pixels, { bytesPerRow: 4 * 4 }, [4, 4]);

const shader = device.createShaderModule({ code: `
@group(0) @binding(0) var samp : sampler;
@group(0) @binding(1) var tex : texture_2d<f32>;

struct Out { @builtin(position) pos : vec4f, @location(0) uv : vec2f };

@vertex fn vs(@builtin(vertex_index) i : u32) -> Out {
  let p = array<vec2f, 6>(vec2f(-1, -1), vec2f(1, -1), vec2f(-1, 1),
                          vec2f(-1, 1), vec2f(1, -1), vec2f(1, 1));
  var o : Out;
  o.pos = vec4f(p[i], 0.0, 1.0);
  o.uv = vec2f(p[i].x * 0.5 + 0.5, 0.5 - p[i].y * 0.5);   // 左上 (0,0)，右下 (1,1)
  return o;
}
@fragment fn fs(@location(0) uv : vec2f) -> @location(0) vec4f {
  return textureSample(tex, samp, uv);
}
`});

const pipeline = device.createRenderPipeline({
  layout: 'auto',
  vertex:   { module: shader, entryPoint: 'vs' },
  fragment: { module: shader, entryPoint: 'fs', targets: [{ format }] },
});

// 同一张纹理，配两个只差 magFilter 的采样器
const groups = {};
for (const mode of ['nearest', 'linear']) {
  groups[mode] = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: device.createSampler({ magFilter: mode }) },
      { binding: 1, resource: texture.createView() },
    ],
  });
}

function draw(mode) {
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      clearValue: { r: 0.07, g: 0.07, b: 0.09, a: 1 },
      loadOp: 'clear',
      storeOp: 'store',
    }],
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, groups[mode]);
  pass.draw(6);
  pass.end();
  device.queue.submit([encoder.finish()]);
  status.textContent = `已绘制：4×4 纹理放大到 512×512，magFilter = ${mode}`;
  button.textContent = mode === 'nearest' ? '切换到 linear' : '切换到 nearest';
  button.dataset.mode = mode;
}

button.onclick = () => draw(button.dataset.mode === 'nearest' ? 'linear' : 'nearest');
button.disabled = false;
draw('nearest');
} catch (error) {
  status.textContent = "无法启动：" + error.message;
}
</script>
